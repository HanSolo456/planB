<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" rx="8" fill="#2B5D5C"/>
  <rect x="1.5" y="1.5" width="45" height="45" rx="6.5" stroke="#3F7E7C" stroke-width="1.5"/>
  
  <!-- Waypoint Origin (Node A) -->
  <circle cx="12" cy="34" r="3" fill="#FFFFFF"/>
  
  <!-- Original Disrupted Path (Dashed with Amber warning node) -->
  <path d="M14 32L24 22" stroke="#E8C9BD" stroke-width="1.8" stroke-dasharray="2 2" stroke-linecap="round" opacity="0.6"/>
  <circle cx="24" cy="22" r="2.5" fill="#B8552F" stroke="#FAF1EB" stroke-width="1"/>
  
  <!-- Recovery Reroute Curve (Plan B: Swooping upwards into destination) -->
  <path d="M12 34C14 18 24 12 36 12" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Destination Waypoint (Node B) -->
  <circle cx="36" cy="12" r="3.5" fill="#FFFFFF"/>
  <circle cx="36" cy="12" r="1.5" fill="#2B5D5C"/>
  
  <!-- Navigational Aircraft Delta / Heading Indicator -->
  <path d="M26 15.5L31.5 13.5L29 19L27 17.5L26 15.5Z" fill="#FFFFFF"/>
  
  <!-- Flight Manifest Coordinate Ticks -->
  <line x1="6" y1="6" x2="10" y2="6" stroke="#5EEAD4" stroke-width="1.2" opacity="0.7"/>
  <line x1="6" y1="6" x2="6" y2="10" stroke="#5EEAD4" stroke-width="1.2" opacity="0.7"/>
  <line x1="42" y1="42" x2="38" y2="42" stroke="#5EEAD4" stroke-width="1.2" opacity="0.7"/>
  <line x1="42" y1="42" x2="42" y2="38" stroke="#5EEAD4" stroke-width="1.2" opacity="0.7"/>
</svg>
